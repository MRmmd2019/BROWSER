name: 🧩 Browser Extractor Pro

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL of the page to extract'
        required: true

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ==================== پیش‌نیازهای سیستم ====================
      - name: Setup system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl zip wget

      # ==================== نصب Node.js و Playwright ====================
      - name: Setup Node.js and Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      # ==================== نصب monolith (روش مقاوم) ====================
      - name: Setup monolith
        run: |
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/Y2Z/monolith/releases/latest | \
            grep "browser_download_url.*x86_64-unknown-linux-gnu" | \
            cut -d '"' -f 4)

          if [ -n "$DOWNLOAD_URL" ]; then
            echo "Downloading from: $DOWNLOAD_URL"
            wget "$DOWNLOAD_URL" -O monolith.tar.gz
            tar xzf monolith.tar.gz
            sudo mv monolith /usr/local/bin/
          else
            echo "Falling back to cargo install..."
            sudo apt-get install -y cargo
            cargo install monolith
          fi

          monolith --version
          echo "Monolith installed successfully"

      # ==================== آماده‌سازی نام پوشه مقصد ====================
      - name: Prepare output directory
        run: |
          URL="${{ github.event.inputs.url }}"
          DOMAIN=$(echo "$URL" | awk -F/ '{print $3}' | sed 's/^www\.//')
          FOLDER_NAME="${DOMAIN}_$(date +%Y%m%d_%H%M%S)"
          OUT_DIR="BROWSER/${FOLDER_NAME}"
          mkdir -p "$OUT_DIR/assets"
          echo "OUT_DIR=$OUT_DIR" >> $GITHUB_ENV
          echo "FOLDER_NAME=$FOLDER_NAME" >> $GITHUB_ENV
          echo "DOMAIN=$DOMAIN" >> $GITHUB_ENV
          echo "URL=$URL" >> $GITHUB_ENV

          CLEAN_URL=$(echo "$URL" | sed 's/\?.*//')
          echo "CLEAN_URL=$CLEAN_URL" >> $GITHUB_ENV

      # ==================== استخراج کامل صفحه با Playwright (اسکریپت inline) ====================
      - name: Extract page with Playwright
        run: |
          cat > extract.js << 'SCRIPT'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const url = process.argv[2];
          const outDir = process.argv[3];

          function sanitizeFilename(urlPath) {
            return decodeURIComponent(urlPath)
              .replace(/[<>:"|?*]/g, '_')
              .replace(/\/$/, '/index.html');
          }

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();

            // ========== ۱. ذخیره تمام منابع (CSS, JS, تصاویر، فونت، JSON) ==========
            page.on('response', async (response) => {
              if (response.status() === 200) {
                const headers = response.headers();
                const contentType = headers['content-type'] || '';
                if (
                  contentType.includes('text/css') ||
                  contentType.includes('application/javascript') ||
                  contentType.includes('image/') ||
                  contentType.includes('font') ||
                  contentType.includes('application/json')
                ) {
                  try {
                    const buffer = await response.body();
                    const respUrl = new URL(response.url());
                    const cleanPath = sanitizeFilename(respUrl.pathname);
                    const assetPath = path.join(outDir, 'assets', respUrl.hostname, cleanPath);
                    fs.mkdirSync(path.dirname(assetPath), { recursive: true });
                    fs.writeFileSync(assetPath, buffer);
                  } catch (e) {
                    // چشم‌پوشی از خطاهای غیرمنتظره
                  }
                }
              }
            });

            // ========== ۲. بارگذاری صفحه با timeout بالا ==========
            await page.goto(url, {
              waitUntil: 'networkidle',
              timeout: 120000
            });

            // ========== ۳. اسکرول هوشمند برای بارگذاری کامل محتوای lazy ==========
            await page.evaluate(async () => {
              await new Promise((resolve) => {
                let totalHeight = 0;
                const distance = 400;
                const timer = setInterval(() => {
                  const scrollHeight = document.body.scrollHeight;
                  window.scrollBy(0, distance);
                  totalHeight += distance;
                  if (totalHeight >= scrollHeight || totalHeight > 50000) {
                    clearInterval(timer);
                    resolve();
                  }
                }, 10);
              });
            });
            await page.waitForTimeout(2000);

            // ========== ۴. برگشت به بالای صفحه برای گرفتن اسکرین‌شات کامل ==========
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(500); // کمی صبر برای رندر نهایی در بالای صفحه

            // ========== ۵. استخراج تمام لینک‌های موجود در صفحه ==========
            const allLinks = await page.evaluate(() => {
              const links = [];
              document.querySelectorAll('a').forEach(a => { if (a.href) links.push(a.href); });
              document.querySelectorAll('link').forEach(link => { if (link.href) links.push(link.href); });
              document.querySelectorAll('script').forEach(script => { if (script.src) links.push(script.src); });
              document.querySelectorAll('img').forEach(img => { if (img.src) links.push(img.src); });
              document.querySelectorAll('video, audio, source').forEach(el => { if (el.src) links.push(el.src); });
              document.querySelectorAll('iframe').forEach(iframe => { if (iframe.src) links.push(iframe.src); });
              return [...new Set(links)]; // حذف تکراری‌ها
            });
            fs.writeFileSync(path.join(outDir, 'all_links.json'), JSON.stringify(allLinks, null, 2));

            // ========== ۶. لانگ اسکرین کامل (full-page screenshot) ==========
            try {
              await page.screenshot({
                path: path.join(outDir, 'screenshot.png'),
                fullPage: true,
                timeout: 120000
              });
            } catch (err) {
              console.error('Full-page screenshot failed, trying viewport:', err.message);
              await page.screenshot({
                path: path.join(outDir, 'screenshot.png'),
                fullPage: false,
                timeout: 60000
              });
            }

            // ========== ۷. ذخیره HTML نهایی صفحه ==========
            const html = await page.content();
            fs.writeFileSync(path.join(outDir, 'index.html'), html);

            // ========== ۸. خروجی PDF با استفاده از پروتکل DevTools (PrintToPDF) ==========
            try {
              // تنظیم راست‌چین برای متن فارسی
              await page.evaluate(() => {
                document.body.style.direction = 'rtl';
              });

              const session = await page.context().newCDPSession(page);
              const result = await session.send('Page.printToPDF', {
                printBackground: true,
                preferCSSPageSize: true,
                displayHeaderFooter: false,
                marginTop: '0.4in',
                marginBottom: '0.4in',
                marginLeft: '0.4in',
                marginRight: '0.4in',
                landscape: false,
                transferMode: 'ReturnAsStream'
              });

              const stream = result.stream;
              const pdfData = await session.send('IO.read', { handle: stream });
              fs.writeFileSync(path.join(outDir, 'page.pdf'), Buffer.from(pdfData.data, 'base64'));
              await session.send('IO.close', { handle: stream });
              console.log('PDF generated successfully using CDP PrintToPDF');
            } catch (pdfErr) {
              console.error('CDP PDF generation failed, trying standard method:', pdfErr.message);
              try {
                await page.pdf({
                  path: path.join(outDir, 'page.pdf'),
                  format: 'A4',
                  printBackground: true,
                  timeout: 120000
                });
              } catch (standardPdfErr) {
                console.error('Standard PDF generation also failed:', standardPdfErr.message);
              }
            }

            await browser.close();
          })();
          SCRIPT

          node extract.js "${{ github.event.inputs.url }}" "$OUT_DIR"

      # ==================== ساخت HTML تک‌فایلی با monolith ====================
      - name: Create monolithic HTML
        run: |
          monolith "$CLEAN_URL" -o "$OUT_DIR/page_monolith.html" || \
          monolith "$URL" -o "$OUT_DIR/page_monolith.html" || \
          echo "Monolith failed, downloading raw HTML" && \
          curl -sL "$URL" > "$OUT_DIR/page_monolith.html"

      # ==================== ایجاد آرشیو ZIP (حداکثر فشرده‌سازی) ====================
      - name: Create ZIP archive
        run: |
          cd "$OUT_DIR"
          zip -9 -r "../../${FOLDER_NAME}.zip" .
          cd ../..
          echo "ZIP_FILE=${FOLDER_NAME}.zip" >> $GITHUB_ENV

      # ==================== تولید README.md کامل ====================
      - name: Generate README.md
        run: |
          SHA256=$(sha256sum "BROWSER/${FOLDER_NAME}.zip" | awk '{print $1}')
          SIZE=$(du -sh "BROWSER/${FOLDER_NAME}.zip" | cut -f1)
          RAW_URL="https://github.com/${{ github.repository }}/raw/${{ github.ref_name }}/BROWSER/${FOLDER_NAME}.zip"

          cat > "$OUT_DIR/README.md" << EOF
          # ${FOLDER_NAME}

          ---

          ## 📄 Page Information
          | Property          | Value                          |
          |-------------------|--------------------------------|
          | **Original URL**   | \`${URL}\` |
          | **Archive Name**   | \`${FOLDER_NAME}.zip\`                |
          | **Total Size**     | ${SIZE}                        |
          | **Status**         | ✅ Complete                    |
          | **Password Protected** | NO |
          | **SHA256 Checksum**| \`${SHA256}\`                  |
          | **Compression Level** | 9 (maximum)                 |

          ---

          ## 🔗 Download Links
          | # | File | Link |
          |---|------|------|
          | 1 | \`${FOLDER_NAME}.zip\` | [Download](${RAW_URL}) |

          ---

          ## 📦 Contents
          - \`index.html\` – Full rendered HTML (from Playwright)
          - \`screenshot.png\` – Full‑page long screenshot (with auto-scroll)
          - \`page.pdf\` – Printable PDF (using print stylesheet)
          - \`assets/\` – All front‑end resources (CSS, JS, images, fonts) saved locally
          - \`page_monolith.html\` – Self‑contained single HTML (inline CSS/images)
          - \`all_links.json\` – All links extracted from the page

          ---

          ## 📦 How to Use
          1. Download the ZIP file from the link above.
          2. Open \`page_monolith.html\` for a clean, offline reading experience (all styles & images embedded).
          3. If you need the exact original experience, open \`index.html\` while keeping the \`assets/\` folder in the same directory.
          4. Refer to \`screenshot.png\` for a full‑page visual snapshot (with auto-scroll).
          5. Use \`page.pdf\` for printing or permanent archiving.
          6. Verify integrity using the SHA256 checksum above.

          ---

          *Powered by [MR.MMD2019](https://github.com/MRmmd2019)*
          EOF

      # ==================== ذخیره در مخزن ====================
      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add BROWSER/
          git commit -m "Add extracted page: ${FOLDER_NAME}" || true
          git push
